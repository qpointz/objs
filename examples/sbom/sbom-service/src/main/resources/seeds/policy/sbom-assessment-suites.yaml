apiVersion: objs.poc.org/v1
kind: PolicySuite
mode: replace
key: sbom-software-quality
name: Software quality
rollUpStrategyKind: BUILTIN
executionStrategyKind: DEDUPE
folders:
  - key: root
    name: Software quality
    participation: ENABLED
    rollUpMode: ALL_PASS
  - key: dim-licensing
    name: Licensing
    parentKey: root
    participation: ENABLED
    rollUpMode: ALL_PASS
  - key: measure-spdx
    name: SPDX / license edge
    parentKey: dim-licensing
    participation: ENABLED
    rollUpMode: ALL_PASS
    matchers:
      - kind: STATIC_LIST
        entries:
          - policyKey: sbom-component-license-required
          - policyKey: sbom-license-spdx-required
  - key: measure-no-proprietary
    name: No proprietary dual-license
    parentKey: dim-licensing
    participation: ENABLED
    rollUpMode: ALL_PASS
    matchers:
      - kind: STATIC_LIST
        entries:
          - policyKey: sbom-no-proprietary-dual-license
  - key: dim-supply-chain
    name: Supply chain
    parentKey: root
    participation: ENABLED
    rollUpMode: ALL_PASS
  - key: measure-identity
    name: Package identity
    parentKey: dim-supply-chain
    participation: ENABLED
    rollUpMode: ALL_PASS
    matchers:
      - kind: STATIC_LIST
        entries:
          - policyKey: sbom-coordinates-required
          - policyKey: sbom-ecosystem-required
          - policyKey: sbom-component-version-required
  - key: measure-release-version
    name: Release version
    parentKey: dim-supply-chain
    participation: ENABLED
    rollUpMode: ALL_PASS
    matchers:
      - kind: STATIC_LIST
        entries:
          - policyKey: sbom-release-version
  - key: dim-integrity
    name: Integrity
    parentKey: root
    participation: ENABLED
    rollUpMode: ALL_PASS
  - key: measure-checksums
    name: Checksums & digests
    parentKey: dim-integrity
    participation: ENABLED
    rollUpMode: ALL_PASS
    matchers:
      - kind: STATIC_LIST
        entries:
          - policyKey: sbom-artifact-checksum
          - policyKey: sbom-container-image-digest
tags: [sbom, assessment]

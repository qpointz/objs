          schema:
            type: "STRING"
            title: "Context window"
            description: "Maximum context size"
          required: false
        - name: "maxOutputTokens"
          schema:
            type: "STRING"
            title: "Max output tokens"
            description: "Maximum output size"
          required: false
    required: false
  - name: "hosting"
    schema:
        type: "OBJECT"
        title: "Hosting"
        description: "Where the model is hosted"
        fields:
        - name: "platform"
          schema:
            type: "STRING"
            title: "Platform"
            description: "Hosting platform"

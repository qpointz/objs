    schema:
      type: "ENUM"
      title: "Status"
      description: "Enterprise usage status"
      values:
        - value: "Candidate"
          description: "Under evaluation"
        - value: "Approved"
          description: "Approved for use"
        - value: "Restricted"
          description: "Restricted use"
        - value: "Deprecated"
          description: "Deprecated"
    required: true
    searchable: true
  - name: "dataClassificationAllowed"
    schema:
      type: "ENUM"
      title: "Data classification allowed"
      description: "Highest permitted data classification"
      values:
        - value: "Public"
          description: "Publicly shareable"
        - value: "Internal"
          description: "Internal use"
        - value: "Confidential"
          description: "Confidential"
        - value: "Restricted"
          description: "Restricted"
    required: false
  - name: "owner"
    schema:
      type: "STRING"
      title: "Owner"
      description: "Responsible internal team"
    searchable: true
    required: false
  - name: "license"
    schema:
      type: "STRING"
      title: "License"
      description: "Licensing terms"
    required: false

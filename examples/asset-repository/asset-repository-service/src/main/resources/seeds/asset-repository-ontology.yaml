apiVersion: "objs.poc.org/v1"
kind: "ObjectSchema"
type: "Dataset"
version: "1.0.0"
contentSchema:
  type: "OBJECT"
  title: "Dataset"
  description: "A collection of data used for building, evaluating, providing knowledge to, or operating AI solutions"
  fields:
  - name: "datasetId"
    schema:
      type: "STRING"
      title: "Dataset id"
      description: "Enterprise DMO external identifier"
    required: true
    identifier: true
    searchable: true
  - name: "name"
    schema:
      type: "STRING"
      title: "Name"
      description: "Dataset name"
    required: true
    searchable: true
  - name: "description"
    schema:
      type: "STRING"
      title: "Description"
      description: "Human-readable description"
    required: false
  - name: "purpose"
    schema:
      type: "ENUM"
      title: "Purpose"
      description: "Primary purpose"
      values:
        - value: "Training"
          description: "Used to train models"
        - value: "Validation"
          description: "Used to validate models"
        - value: "Evaluation"
          description: "Used to evaluate quality"
        - value: "Knowledge"
          description: "Used as knowledge content"
        - value: "Operational"
          description: "Used in production operations"
        - value: "Other"
          description: "Other purpose"
    required: true
    searchable: true
  - name: "catalog"
    schema:
      type: "STRING"
      title: "Catalog"
      description: "Catalog where the dataset is registered"
    searchable: true
    required: false
  - name: "format"
    schema:
      type: "ENUM"
      title: "Format"
      description: "Physical or logical data format"
      values:
        - value: "CSV"
          description: "Comma-separated values"
        - value: "Parquet"
          description: "Apache Parquet"
        - value: "JSON"
          description: "JSON records or documents"
        - value: "Database Table"
          description: "Relational table"
        - value: "Documents"
          description: "Document corpus"
        - value: "Images"
          description: "Image corpus"
        - value: "Audio"
          description: "Audio corpus"
        - value: "Video"
          description: "Video corpus"
    searchable: true
    required: false
  - name: "service"
    schema:
      type: "STRING"
      title: "Service"
      description: "Service where the data is stored"
    required: false
  - name: "location"
    schema:
      type: "STRING"
      title: "Location"
      description: "Physical or logical location"
    required: false
  - name: "owner"
    schema:
      type: "STRING"
      title: "Owner"
      description: "Responsible team"
    searchable: true
    required: false
  - name: "classification"
    schema:
      type: "ENUM"
      title: "Classification"
      description: "Data sensitivity"
      values:
        - value: "Public"
          description: "Publicly shareable"
        - value: "Internal"
          description: "Internal use"
        - value: "Confidential"
          description: "Confidential"
        - value: "Restricted"
          description: "Restricted"
    required: true
    searchable: true
  - name: "size"
    schema:
      type: "STRING"
      title: "Size"
      description: "Approximate size"
    required: false
  - name: "lastUpdated"
    schema:
      type: "STRING"
      title: "Last updated"
      description: "Last significant update"
      format: "date"
    required: false
---

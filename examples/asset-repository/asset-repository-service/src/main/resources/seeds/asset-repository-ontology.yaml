              values:
                - value: "Text"
                  description: "Text"
                - value: "Image"
                  description: "Image"
                - value: "Audio"
                  description: "Audio"
                - value: "Video"
                  description: "Video"
          required: false
        - name: "outputs"
          schema:
            type: "ARRAY"
            title: "Outputs"
            description: "Produced output modalities"
            items:
              type: "ENUM"
              title: "Modality"
              description: "Output modality"
              values:
                - value: "Text"
                  description: "Text"
                - value: "Image"
                  description: "Image"
                - value: "Audio"
                  description: "Audio"
                - value: "Video"
                  description: "Video"
          required: false

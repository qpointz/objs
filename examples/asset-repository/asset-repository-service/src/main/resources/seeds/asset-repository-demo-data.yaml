apiVersion: objs.poc.org/v1
kind: CollectionObjects
collection: models
objects:
- key: model-01
  type: LlmModel
  schemaVersion: 1.0.0
  payload:
    modelId: gpt-demo-01
    name: GPT 01
    description: OpenAI GPT catalog entry
    vendor: OpenAI
    family: GPT
    version: '2025-01-01'
    catalog: Enterprise Model Catalog
    modelType: General Purpose
    io:
      inputs:
      - Text
      outputs:
      - Text
    limits:
      contextWindow: 128k tokens
    hosting:
      platform: Azure OpenAI
      region: Switzerland North
    status: Candidate
    dataClassificationAllowed: Public
    owner: Enterprise AI Platform

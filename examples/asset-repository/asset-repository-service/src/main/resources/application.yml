spring:
  application:
    name: asset-repository
  datasource:
    url: jdbc:h2:mem:assetrepository;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

objs:
  seeds:
    enabled: false
    on-failure: FAIL_FAST

springdoc:
  remove-broken-reference-definitions: false

---
spring:
  config:
    activate:
      on-profile: demo

# Ontology schemas. Instance collections: seeds/asset-repository-demo-data.yaml (kind Collection / CollectionObjects).
objs:
  seeds:
    enabled: true
    resources:
      - classpath:seeds/asset-repository-ontology.yaml
      - classpath:seeds/asset-repository-demo-data.yaml
    on-failure: FAIL_FAST

---
spring:
  config:
    activate:
      on-profile: demo-empty

# Ontology schemas. Instance collections: seeds/asset-repository-demo-data.yaml (kind Collection / CollectionObjects).
objs:
  seeds:
    enabled: true
    resources:
      - classpath:seeds/asset-repository-ontology.yaml
    on-failure: FAIL_FAST

---
# Performance noise fill (ontology only — not demo volumes).
# Totals objects/edges split across ar.perf.graphs collections; versions are per graph.
#   ./gradlew :asset-repository-service:run --args="--spring.profiles.active=perf"
#   ./gradlew :asset-repository-service:run --args="--spring.profiles.active=perf,postgres --ar.perf.graphs=10 --ar.perf.objects=50000 --ar.perf.edges=100000 --ar.perf.versions=3"
# Env: AR_PERF_GRAPHS, AR_PERF_OBJECTS, AR_PERF_EDGES, AR_PERF_VERSIONS, AR_PERF_BATCH_SIZE, AR_PERF_COLLECTION
spring:
  config:
    activate:
      on-profile: perf

objs:
  seeds:
    enabled: true
    resources:
      - classpath:seeds/asset-repository-ontology.yaml
    on-failure: FAIL_FAST

ar:
  perf:
    graphs: ${AR_PERF_GRAPHS:1}
    objects: ${AR_PERF_OBJECTS:1000}
    edges: ${AR_PERF_EDGES:2000}
    batch-size: ${AR_PERF_BATCH_SIZE:500}
    collection: ${AR_PERF_COLLECTION:perf-noise}
    versions: ${AR_PERF_VERSIONS:0}

---
# PostgreSQL persistence. Start PostgreSQL separately, then run with:
#   ./gradlew :asset-repository-service:run --args="--spring.profiles.active=demo,postgres"
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${OBJS_DB_URL:jdbc:postgresql://localhost:5432/objs}
    driver-class-name: org.postgresql.Driver
    username: ${OBJS_DB_USERNAME:postgres}
    password: ${OBJS_DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${OBJS_DB_POOL_MAX:20}
      minimum-idle: ${OBJS_DB_POOL_MIN_IDLE:2}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

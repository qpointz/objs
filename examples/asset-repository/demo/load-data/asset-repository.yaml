      - name: skill_uses_prompt
        rows: 40
        attributes:
          - name: skillId
            type: "${ref}"
            params: { dataset: skill, attribute: skillId, cord: "1-*" }
          - name: promptId
            type: "${ref}"
            params: { dataset: prompt, attribute: promptId, cord: "1-*" }

      - name: skill_uses_tool
        rows: 40
        attributes:
          - name: skillId
            type: "${ref}"
            params: { dataset: skill, attribute: skillId, cord: "1-*" }
          - name: toolId

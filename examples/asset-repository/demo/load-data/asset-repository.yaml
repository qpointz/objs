          - name: access
            type: random_element
            params:
              elements: ["Internal", "External", "Restricted", "Public"]
          - name: owner
            type: random_element
            params:
              elements: ["Customer Platform", "AI Infrastructure", "Data Platform"]
          - name: status
            type: random_element
            params:
              elements: ["Development", "Pilot", "Production", "Suspended", "Retired"]

      - name: mcp_tool
        rows: 50
        attributes: *tool_attrs

      - name: mcp_knowledge
        rows: 25

# Demo-seed ratios. Scale volume with rows_multiply only (1.0 = committed default extract).
rows_multiply: 0.2

experiments:
  write_csv:
    type: csv
    path: "generated/{dataset-name}.csv"
    params:
      sep: ","
      header: true
      index: false

models:
  - name: asset_repository
    locales: ["en-US"]
    schemas:

      - name: dataset
        rows: 50
        description: Library datasets collection
        attributes:
          - name: datasetId
            type: uuid4
          - name: name
            type: catch_phrase
          - name: description
            type: sentence
          - name: purpose
            type: random_element
            params:
              elements: ["Training", "Validation", "Evaluation", "Knowledge", "Operational", "Other"]
          - name: catalog
            type: random_element
            params:
              elements: ["Enterprise Data Catalog", "Corporate Data Catalog", "AI Data Catalog"]
          - name: format
            type: random_element
            params:
              elements: ["CSV", "Parquet", "JSON", "Database Table", "Documents", "Images", "Audio", "Video"]
          - name: service
            type: random_element
            params:
              elements: ["Azure Blob Storage", "SharePoint", "PostgreSQL", "S3", "Snowflake", "BigQuery"]
          - name: location
            type: file_path
          - name: owner
            type: random_element
            params:
              elements: ["Customer Service Analytics", "Product Management", "AI Quality Engineering", "Customer Platform", "Finance Analytics", "HR Analytics", "Risk Data Office"]
          - name: classification
            type: random_element
            params:
              elements: ["Public", "Internal", "Confidential", "Restricted"]
          - name: size
            type: bothify
            params:
              text: "## GB"
          - name: lastUpdated
            type: date_this_year

      - name: llm_model
        rows: 20
        attributes:
          - name: modelId
            type: uuid4
          - name: name
            type: bothify
            params:
              text: "Model ???? ##"
          - name: description
            type: sentence
          - name: vendor
            type: random_element
            params:
              elements: ["OpenAI", "Anthropic", "Google", "Meta", "Mistral", "Amazon"]
          - name: family
            type: random_element
            params:
              elements: ["GPT", "Claude", "Gemini", "Llama", "Mistral", "Titan"]
          - name: version
            type: bothify
            params:
              text: "2025-##-01"
          - name: catalog
            type: random_element
            params:
              elements: ["Approved Model Catalog", "Enterprise Model Catalog"]
          - name: modelType
            type: random_element
            params:
              elements: ["General Purpose", "Reasoning", "Coding", "Multimodal", "Other"]
          - name: io_inputs
            type: random_element
            params:
              elements: ["Text", "Text|Image", "Text|Image|Audio|Video"]
          - name: io_outputs
            type: random_element
            params:
              elements: ["Text", "Text|Image"]
          - name: limits_contextWindow
            type: random_element
            params:
              elements: ["128k tokens", "200k tokens", "1M tokens"]
          - name: hosting_platform
            type: random_element
            params:
              elements: ["Azure OpenAI", "Anthropic", "Google Cloud", "Internal GPU Platform", "Azure AI", "AWS Bedrock"]
          - name: hosting_region
            type: random_element
            params:
              elements: ["Switzerland North", "West Europe", "East US", "Frankfurt"]
          - name: status
            type: random_element
            params:
              elements: ["Candidate", "Approved", "Restricted", "Deprecated"]
          - name: dataClassificationAllowed
            type: random_element
            params:
              elements: ["Public", "Internal", "Confidential", "Restricted"]
          - name: owner
            type: random_element
            params:
              elements: ["Enterprise AI Platform"]

      - name: ai_agent
        rows: 100
        attributes:
          - name: agentId
            type: uuid4
          - name: name
            type: bothify
            params:
              text: "Agent ????"
          - name: description
            type: sentence
          - name: catalog
            type: random_element
            params:
              elements: ["Enterprise AI Catalog"]
          - name: category
            type: random_element
            params:
              elements: ["Customer Support", "Software Development", "Data Analytics", "Finance", "Human Resources", "Sales", "Operations", "Research", "Legal", "Risk"]
          - name: capabilities
            type: random_element
            params:
              elements:
                - "Question Answering|Search|Summarization"
                - "Search|Summarization|Content Generation"
                - "Summarization|Content Generation|Data Analysis"
                - "Content Generation|Data Analysis|Classification"
                - "Data Analysis|Classification|Recommendation"
                - "Classification|Recommendation|Task Automation"
                - "Recommendation|Task Automation|Decision Support"
                - "Task Automation|Decision Support|Question Answering"
                - "Decision Support|Question Answering|Search"
          - name: runtime_platform
            type: random_element
            params:
              elements: ["Enterprise AI Platform"]
          - name: runtime_interactionMode
            type: random_element
            params:
              elements: ["Conversational", "API", "Background", "Embedded"]
          - name: runtime_autonomyLevel
            type: random_element
            params:
              elements: ["Assistant", "Assisted", "Autonomous"]
          - name: status
            type: random_element
            params:
              elements: ["Development", "Pilot", "Production", "Suspended", "Retired"]
          - name: owner
            type: random_element
            params:
              elements: ["Customer Support", "Software Development", "Data Analytics", "Finance", "Human Resources", "Sales", "Operations", "Research", "Legal", "Risk"]
          - name: access
            type: random_element
            params:
              elements: ["Internal", "External", "Restricted", "Public"]
          - name: businessCriticality
            type: random_element
            params:
              elements: ["Low", "Medium", "High", "Critical"]

      - name: prompt
        rows: 50
        attributes: &prompt_attrs
          - name: promptId
            type: uuid4
          - name: name
            type: bothify
            params:
              text: "Prompt ????"
          - name: description
            type: sentence
          - name: catalog
            type: random_element
            params:
              elements: ["Enterprise AI Catalog"]
          - name: promptType
            type: random_element
            params:
              elements: ["System", "Task", "Classification", "Extraction", "Generation", "Evaluation", "Other"]
          - name: version
            type: bothify
            params:
              text: "#.#.0"
          - name: language
            type: random_element
            params:
              elements: ["English", "German", "French"]
          - name: owner
            type: job
          - name: status
            type: random_element
            params:
              elements: ["Draft", "Approved", "Deprecated"]
          - name: body
            type: paragraph

      - name: skill
        rows: 40
        attributes: &skill_attrs
          - name: skillId
            type: uuid4
          - name: name
            type: bothify
            params:
              text: "Skill ????"
          - name: description
            type: sentence
          - name: catalog
            type: random_element
            params:
              elements: ["Enterprise AI Catalog"]
          - name: category
            type: random_element
            params:
              elements: ["Customer Support", "Software Development", "Data Analytics", "Finance", "Human Resources", "Sales", "Operations", "Research", "Legal", "Risk"]
          - name: version
            type: bothify
            params:
              text: "#.#.0"
          - name: owner
            type: job
          - name: status
            type: random_element
            params:
              elements: ["Draft", "Approved", "Deprecated"]

      - name: tool
        rows: 40
        attributes: &tool_attrs
          - name: toolId
            type: uuid4
          - name: name
            type: bothify
            params:
              text: "Tool ????"
          - name: description
            type: sentence
          - name: catalog
            type: random_element
            params:

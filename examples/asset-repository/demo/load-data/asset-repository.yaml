      - name: knowledge
        rows: 20
        attributes: &knowledge_attrs
          - name: knowledgeSourceId
            type: uuid4
          - name: name
            type: bothify
            params:
              text: "Knowledge ????"
          - name: description
            type: sentence
          - name: catalog
            type: random_element
            params:
              elements: ["Enterprise AI Catalog"]
          - name: access_knowledgeType
            type: random_element
            params:
              elements: ["Documents", "Structured Data", "Web Content", "Mixed"]
          - name: access_accessMethod
            type: random_element
            params:
              elements: ["Semantic Search", "Keyword Search", "Database Query", "API", "Direct Context"]
          - name: access_refreshFrequency
            type: random_element
            params:
              elements: ["Hourly", "Daily", "Weekly"]
          - name: owner
            type: random_element

          - name: templateId
            type: "${ref}"
            params: { dataset: template, attribute: templateId, cord: "1-*" }

      - name: skill_depends_on
        rows: 5
        attributes:
          - name: skillId
            type: "${ref}"
            params: { dataset: skill, attribute: skillId, cord: "*-*" }
          - name: dependsOnSkillId
            type: "${ref}"
            params: { dataset: skill, attribute: skillId, cord: "*-*" }

      - name: prompt_uses_template
        rows: 25
        attributes:
          - name: promptId
            type: "${ref}"
            params: { dataset: prompt, attribute: promptId, cord: "1-*" }
          - name: templateId
            type: "${ref}"
            params: { dataset: template, attribute: templateId, cord: "1-*" }


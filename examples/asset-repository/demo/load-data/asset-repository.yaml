          - name: integration_operationType
            type: random_element
            params:
              elements: ["Read", "Write", "Read / Write"]
          - name: integration_service
            type: random_element
            params:
              elements: ["Azure Blob Storage", "SharePoint", "PostgreSQL", "S3", "Snowflake", "BigQuery"]
          - name: version
            type: bothify
            params:
              text: "1.#.0"
          - name: owner
            type: random_element
            params:
              elements: ["Customer Platform", "AI Infrastructure", "Data Platform"]
          - name: status
            type: random_element
            params:
              elements: ["Draft", "Approved", "Deprecated"]

      - name: guardrail
        rows: 25
        attributes: &guardrail_attrs
          - name: guardrailId
            type: uuid4
          - name: name
            type: bothify
            params:
              text: "Guardrail ????"
          - name: description
            type: sentence
          - name: catalog

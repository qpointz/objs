services:
  postgres:
    image: postgres:17-alpine
    container_name: objs-local-postgres
    environment:
      POSTGRES_DB: ${OBJS_DB_NAME:-objs}
      POSTGRES_USER: ${OBJS_DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${OBJS_DB_PASSWORD:-postgres}
    ports:
      - "${OBJS_DB_PORT:-5432}:5432"
    volumes:
      - ../../.data/local-dev/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

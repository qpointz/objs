[versions]
lombok = "1.18.42"
springBoot = "4.0.6"
junit = "6.0.2"
mockito = "5.21.0"
assertj = "3.27.3"
jackson = "3.1.2"
logback = "1.5.28"

[libraries]
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }

boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "springBoot" }
boot-configuration-processor = { module = "org.springframework.boot:spring-boot-configuration-processor", version.ref = "springBoot" }
boot-starter = { module = "org.springframework.boot:spring-boot-starter", version.ref = "springBoot" }
boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test", version.ref = "springBoot" }
boot-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc", version.ref = "springBoot" }
boot-starter-webmvc-test = { module = "org.springframework.boot:spring-boot-starter-webmvc-test", version.ref = "springBoot" }
boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa", version.ref = "springBoot" }
boot-starter-data-jpa-test = { module = "org.springframework.boot:spring-boot-starter-data-jpa-test", version.ref = "springBoot" }
boot-starter-jackson = { module = "org.springframework.boot:spring-boot-starter-jackson", version.ref = "springBoot" }

junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit" }

slf4j-api = { module = "org.slf4j:slf4j-api", version = "2.0.17" }
logback-core = { module = "ch.qos.logback:logback-core", version.ref = "logback" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }

mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
mockito-junit-jupiter = { module = "org.mockito:mockito-junit-jupiter", version.ref = "mockito" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }

h2-database = { module = "com.h2database:h2", version = "2.4.240" }

jackson-core = { module = "tools.jackson.core:jackson-core", version.ref = "jackson" }
jackson-databind = { module = "tools.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-dataformat-yaml = { module = "tools.jackson.dataformat:jackson-dataformat-yaml", version.ref = "jackson" }

[bundles]
jackson = ["jackson-databind", "jackson-dataformat-yaml"]
logging = ["slf4j-api", "logback-core", "logback-classic"]

[plugins]
spring-dependency-management = { id = "io.spring.dependency-management", version = "1.1.6" }
spring-boot-plugin = { id = "org.springframework.boot", version.ref = "springBoot" }

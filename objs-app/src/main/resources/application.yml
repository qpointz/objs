spring:
  application:
    name: objs
  datasource:
    url: jdbc:h2:mem:objs;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

objs:
  seeds:
    enabled: false
    on-failure: FAIL_FAST

# Keep registry-published domain schemas visible even when not $ref'd from operations
springdoc:
  remove-broken-reference-definitions: false

---
# Configure SBOM resources through the shared seed pipeline:
#   ./gradlew :objs-app:run --args="--spring.profiles.active=sbom"
spring:
  config:
    activate:
      on-profile: sbom

objs:
  seeds:
    enabled: true
    resources:
      - classpath:seeds/sbom-ontology.yaml
      - classpath:seeds/sbom-demo-graph.yaml

---
# PostgreSQL persistence. Start PostgreSQL separately, then run with:
#   ./gradlew :objs-app:run --args="--spring.profiles.active=postgres,sbom"
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${OBJS_DB_URL:jdbc:postgresql://localhost:5432/objs}
    driver-class-name: org.postgresql.Driver
    username: ${OBJS_DB_USERNAME:postgres}
    password: ${OBJS_DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${OBJS_DB_POOL_MAX:20}
      minimum-idle: ${OBJS_DB_POOL_MIN_IDLE:2}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

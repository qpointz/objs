include:
  - local: /.gitlab/common/common.yml

workflow:
  rules:
    - when: always

stages:
  - integration

# Postgres service for IT (OBJS_IT_JDBC_*). Local/dev still uses Testcontainers when env is unset.
core:integration:
  stage: integration
  extends: .gradle-job
  services:
    - name: postgres:17-alpine
      alias: postgres
  variables:
    POSTGRES_DB: objs
    POSTGRES_USER: objs
    POSTGRES_PASSWORD: objs
    OBJS_IT_JDBC_URL: jdbc:postgresql://postgres:5432/objs
    OBJS_IT_JDBC_USER: objs
    OBJS_IT_JDBC_PASSWORD: objs
  script:
    - |
      echo "Waiting for Postgres..."
      for i in $(seq 1 30); do
        if bash -c 'echo >/dev/tcp/postgres/5432' >/dev/null 2>&1; then
          echo "Postgres is up"
          break
        fi
        if [ "$i" -eq 30 ]; then
          echo "Postgres did not become ready in time"
          exit 1
        fi
        sleep 1
      done
    - cd "${CI_PROJECT_DIR}"
    - ./gradlew --no-daemon ${GRADLE_CONTINUE_PARAM} --console plain testIT
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - "**/build/reports/tests/testIT/"
    reports:
      junit:
        - "**/build/test-results/testIT/TEST-*.xml"

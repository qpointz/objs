include:
  - local: /.gitlab/common/common.yml

workflow:
  rules:
    - when: always

stages:
  - integration

# Testcontainers needs a Docker daemon. Drop this service if the runner already exposes Docker.
core:integration:
  stage: integration
  extends: .gradle-job
  services:
    - name: docker:27-dind
      alias: docker
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    TESTCONTAINERS_RYUK_DISABLED: "true"
  script:
    - cd "${CI_PROJECT_DIR}"
    - ./gradlew --no-daemon ${GRADLE_CONTINUE_PARAM} --console plain testIT
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - "**/build/reports/tests/testIT/"
    reports:
      junit:
        - "**/build/test-results/testIT/TEST-*.xml"

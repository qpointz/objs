apiVersion: objs.poc.org/v1
kind: Graph
name: sbom-demo
entities:
    - key: payments-product
      type: Product
      schemaVersion: "1.0.0"
      annotations:
        app: payments-api
        appVersion: "2.3.1"
        source: detected
        sourceDetail: demo-seed
      payload:
        name: Payments API
        version: "2.3.1"
    - key: payments-org
      type: Organization
      schemaVersion: "1.0.0"
      annotations:
        app: payments-api
        appVersion: "2.3.1"
        source: enriched
        sourceDetail: catalog1
      payload:
        name: Acme Corp
        domain: acme.example
    - key: payments-lic
      type: License
      schemaVersion: "1.0.0"
      annotations:
        app: payments-api
        appVersion: "2.3.1"
        source: detected
        sourceDetail: demo-seed
      payload:
        name: Apache License 2.0
        spdxId: Apache-2.0
    - key: payments-boot
      type: Component
      schemaVersion: "1.0.0"
      annotations:
        app: payments-api
        appVersion: "2.3.1"
        source: detected
        sourceDetail: demo-seed
      payload:
        name: Spring Boot
        version: "3.3.0"
        ecosystem: Maven
        kind: framework
    - key: payments-jackson
      type: Component
      schemaVersion: "1.0.0"
      annotations:
        app: payments-api
        appVersion: "2.3.1"
        source: manual
        capturedBy: demo-user
      payload:
        name: Jackson Databind
        version: "2.17.0"
        ecosystem: Maven
        kind: library
    - key: billing-guava
      type: Component
      schemaVersion: "1.0.0"
      annotations:
        app: billing-api
        appVersion: "1.0.0"
        source: enriched
        sourceDetail: catalog1
      payload:
        name: Guava
        version: "33.0.0"
        ecosystem: Maven
        kind: library
edges:
    - key: payments-product-contains-boot
      source: payments-product
      target: payments-boot
      role: CONTAINS
      type: CanonicalEdge
      schemaVersion: "1.0.0"
      properties: {}
    - key: payments-product-owned-by-org
      source: payments-product
      target: payments-org
      role: OWNED_BY
      type: CanonicalEdge
      schemaVersion: "1.0.0"
      properties: {}
    - key: payments-boot-depends-on-jackson
      source: payments-boot
      target: payments-jackson
      role: DEPENDS_ON
      type: CanonicalEdge
      schemaVersion: "1.0.0"
      properties: {}
    - key: payments-boot-provided-by-org
      source: payments-boot
      target: payments-org
      role: PROVIDED_BY
      type: CanonicalEdge
      schemaVersion: "1.0.0"
      properties: {}
    - key: payments-boot-licensed-under-lic
      source: payments-boot
      target: payments-lic
      role: LICENSED_UNDER
      type: CanonicalEdge
      schemaVersion: "1.0.0"
      properties: {}
